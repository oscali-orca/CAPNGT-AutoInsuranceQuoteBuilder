# Database settings come from Java-Backend/.env (see .env.example); without it, the local Docker database is used
spring.config.import=optional:file:.env[.properties],optional:file:Java-Backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quotes}
spring.datasource.username=${DB_USERNAME:quotes}
spring.datasource.password=${DB_PASSWORD:quotes}

# Supabase's pooler has a small connection limit shared by the team; Flyway needs at least 2
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate